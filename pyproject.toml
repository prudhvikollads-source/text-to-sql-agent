[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Natural-language questions over a SQLite database: schema introspection, SQL generation, read-only validation, execution, and a self-correction loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prudhvi Kolla" }]
dependencies = ["langgraph>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
text-to-sql = "text_to_sql_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
